apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: file-service
  labels:
    app.kubernetes.io/name: file-service
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: nginx
  rules:
    - host: file.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: file-service
                port:
                  name: http
